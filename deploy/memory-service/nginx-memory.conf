# nginx site for the dsh memory service.
#
# Install to /etc/nginx/sites-available/memory and symlink into sites-enabled.
# The upstream listens on loopback only, so TLS termination and the bearer token
# are the only things exposed publicly.
#
# Replace memory.example.com with the hostname whose A record points at this
# server, then run:
#   sudo certbot --nginx -d memory.example.com --redirect

upstream memory_service {
    server 127.0.0.1:7180;
    keepalive 16;
}

server {
    listen 80;
    listen [::]:80;
    server_name memory.example.com;

    # certbot writes the redirect and the TLS block on first issuance.
    location / {
        return 301 https://$host$request_uri;
    }
}

server {
    listen 443 ssl;
    listen [::]:443 ssl;
    http2 on;
    server_name memory.example.com;

    # certbot manages these two lines.
    # ssl_certificate     /etc/letsencrypt/live/memory.example.com/fullchain.pem;
    # ssl_certificate_key /etc/letsencrypt/live/memory.example.com/privkey.pem;

    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_prefer_server_ciphers off;
    ssl_session_cache shared:memory_ssl:4m;
    ssl_session_timeout 1d;

    add_header Strict-Transport-Security "max-age=31536000" always;
    add_header X-Content-Type-Options nosniff always;

    client_max_body_size 1m;
    access_log /var/log/nginx/memory.access.log;
    error_log  /var/log/nginx/memory.error.log;

    location / {
        proxy_pass http://memory_service;
        proxy_http_version 1.1;
        proxy_set_header Connection "";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        # A recall must never hold a turn; the provider gives up at 1500 ms.
        proxy_connect_timeout 3s;
        proxy_send_timeout 10s;
        proxy_read_timeout 10s;
    }
}
