# Agent preset memory: durable memory over a MemoryBear service, hosted or sent
# by an operator's own deployment.
#
# The memory rows stay disabled until MEMORYBEAR_API_KEY names a MemoryBear API
# key with the `memory` scope, so a memory-less preset remains startable. The
# key comes from that deployment's console; MEMORYBEAR_BASE_URL selects the
# deployment, and the hosted origin applies only when it is unset.
- insert:
    - id: preset-memory
      name: '@deepseek-ai/dsh-agent-preset'
      config:
        id: memory
        name: Memory
        description: Recalls durable user memories before each turn and stores each finished turn.
        order: 2
        plugins:
          # The provider publishes `memory` into this group's isolated realm, so
          # every consumer of that service sits in the same group.
          - id: memory
            name: cordis:group
            group: true
            isolate:
              memory: true
            config:
              - id: memory-bear
                name: '@deepseek-ai/dsh-memory-bear'
                disabled: !!js "!process.env.MEMORYBEAR_API_KEY"
                config:
                  baseUrl: !!js process.env.MEMORYBEAR_BASE_URL ?? 'https://cloud.memorybear.ai'
                  apiKey: !!js process.env.MEMORYBEAR_API_KEY ?? ''
                  endUserOtherId: !!js process.env.MEMORY_USER ?? 'local'
                  # The hosted read path runs retrieval upstream, and a
                  # cross-border round trip adds up to two seconds before the
                  # first byte; the provider's 800 ms default would degrade
                  # healthy recalls.
                  timeoutMs: !!js Number(process.env.MEMORY_TIMEOUT_MS ?? 8000)
              - id: tool-memory
                name: '@deepseek-ai/dsh-tool-memory'
                disabled: !!js "!process.env.MEMORYBEAR_API_KEY"
                config:
                  defaultMode: quick
                  # The MemoryBear service surface has no removal route.
                  enableForget: false
                  enableProfile: true
              - id: memory-autosave
                name: '@deepseek-ai/dsh-memory-autosave'
                disabled: !!js "!process.env.MEMORYBEAR_API_KEY"
                config:
                  recallMode: quick
                  recallOnTurnStart: true
                  writeOnTurnEnd: true
          - id: memory-agent
            name: '@deepseek-ai/dsh-memory-agent'
            disabled: !!js "!process.env.MEMORYBEAR_API_KEY || !process.env.MEMORY_AGENT_STUDIO"
            config:
              provider:
                baseUrl: !!js process.env.MEMORYBEAR_BASE_URL ?? 'https://cloud.memorybear.ai'
                apiKey: !!js process.env.MEMORYBEAR_API_KEY ?? ''
                endUserOtherId: !!js process.env.MEMORY_USER ?? 'local'
              recallMode: quick
          - id: persona
            name: '@deepseek-ai/dsh-persona'
            config:
              prefix: >-
                You are a coding agent powered by the {{model}} model. You have durable memory
                across sessions. Before answering questions about the user's preferences,
                prior decisions, or earlier work, rely on what the session already recalled;
                when the session shows no relevant memory, call `memory_recall` with a rewritten
                question. Record a fact only when the user states it plainly and it will matter
                later; never write summaries of the conversation or transient details.
          - id: agent-instructions
            name: '@deepseek-ai/dsh-agent-instructions'
            config:
              maxBytes: 65536
          - id: time-context
            name: '@deepseek-ai/dsh-time-context'
          - id: tool-bash
            name: '@deepseek-ai/dsh-tool-bash'
            disabled: !!js process.platform === 'win32'
          - id: tool-pwsh
            name: '@deepseek-ai/dsh-tool-pwsh'
            disabled: !!js process.platform !== 'win32'
          - id: tool-fs
            name: '@deepseek-ai/dsh-tool-fs'
            config:
              applyPatch: false
          - id: tool-fs-search
            name: '@deepseek-ai/dsh-tool-fs-search'
            config:
              sampleOverCapGlobResults: false
          - id: tool-jobs
            name: '@deepseek-ai/dsh-tool-jobs'
          - id: tool-todo
            name: '@deepseek-ai/dsh-tool-todo'
            config:
              allowParallelInProgress: true
          - id: compaction
            name: cordis:group
            group: true
            isolate:
              compaction: true
              toolResultPruner: true
            config:
              - id: compaction-basic
                name: '@deepseek-ai/dsh-compaction-basic'
              - id: command-compact
                name: '@deepseek-ai/dsh-command-compact'
